<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Braus hit test</title>
  <style>
    body { margin: 0; font: 16px sans-serif; }
    button, a { position: absolute; left: 40px; width: 200px; height: 40px; }
    #under { top: 40px; }
    #veil { position: fixed; top: 20px; left: 0; width: 100%; height: 80px; z-index: 10; background: rgba(0, 0, 0, 0.6); }
    #through { top: 140px; }
    #glass { position: fixed; top: 120px; left: 0; width: 100%; height: 80px; z-index: 10; pointer-events: none;
             background: rgba(0, 0, 255, 0.2); }
    #link { top: 240px; display: block; }
    #host { position: absolute; top: 300px; left: 40px; width: 200px; height: 40px; }
    #box { position: absolute; top: 380px; left: 40px; width: 300px; height: 100px; overflow: auto; border: 1px solid; }
    #spacer { height: 250px; }
    #hidden { position: static; }
    #start, #inside { margin: 0; height: 20px; }
    #covered-field { position: absolute; top: 50px; left: 300px; width: 200px; height: 30px; }
    #free-field { position: absolute; top: 500px; left: 40px; width: 200px; height: 30px; }
    #outer { position: absolute; top: 240px; left: 400px; width: 300px; height: 150px; overflow: auto;
             border: 1px solid; }
    #inner { height: 100px; overflow: auto; border: 1px solid; }
    #inner-spacer { height: 200px; }
    #outer-spacer { height: 300px; }
    #nested { position: static; }
  </style>
</head>
<body>
  <button id="under" type="button">Sotto</button>
  <div id="veil" role="dialog" aria-label="Avviso cookie"></div>
  <button id="through" type="button">Attraverso</button>
  <div id="glass" aria-hidden="true"></div>
  <a id="link" href="#">Collegamento</a>
  <div id="host"></div>
  <div id="box"><p id="start">Inizio</p><div id="spacer"></div><button id="hidden" type="button">Nascosto</button></div>
  <input id="covered-field" aria-label="Campo coperto">
  <input id="free-field" aria-label="Campo libero">
  <div id="outer">
    <div id="inner">
      <p id="inside">Interno</p><div id="inner-spacer"></div><button id="nested" type="button">Annidato</button>
    </div>
    <div id="outer-spacer"></div>
  </div>
  <script>
    // Every press that reaches the document, and every click each control receives.
    window.__downs = 0;
    window.__clicks = {};
    document.addEventListener('mousedown', () => window.__downs++, true);
    const count = (id) => () => { window.__clicks[id] = (window.__clicks[id] || 0) + 1; };
    for (const id of ['under', 'through', 'hidden', 'nested']) {
      document.getElementById(id).addEventListener('click', count(id));
    }
    // Context menus by the element they reached, wheel turns and key presses that reached the document (W10).
    window.__menus = {};
    window.__wheels = 0;
    window.__keys = 0;
    document.addEventListener('contextmenu', (event) => {
      event.preventDefault();
      const id = event.target.id || event.target.tagName.toLowerCase();
      window.__menus[id] = (window.__menus[id] || 0) + 1;
    }, true);
    document.addEventListener('wheel', () => window.__wheels++, { capture: true, passive: true });
    document.addEventListener('keydown', () => window.__keys++, true);
    document.getElementById('link').addEventListener('click', (event) => { event.preventDefault(); count('link')(); });
    const shadow = document.getElementById('host').attachShadow({ mode: 'open' });
    shadow.innerHTML = '<button type="button" style="width: 200px; height: 40px">Ombra</button>';
    shadow.querySelector('button').addEventListener('click', count('shadow'));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Braus — la casa su macOS</title>
<style>
:root{--txt:#f5f5f7;--mut:#8e8e93;--dim:#5a5a60;--sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Helvetica,sans-serif;--sw:208px;--iw:288px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sf);color:var(--txt);-webkit-font-smoothing:antialiased;letter-spacing:-.011em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
 background:linear-gradient(180deg,#6f7ea6 0%,#9aa3c0 45%,#d7d8e0 100%);padding:20px 16px;overflow:auto}
.ctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ctl button{font:500 12px var(--sf);color:#222;background:rgba(255,255,255,.55);border:0;border-radius:980px;padding:6px 13px;cursor:pointer;backdrop-filter:blur(10px)}
.ctl button.on{background:#111;color:#fff}

/* ---------- the window: sidebar | content | inspector ---------- */
.win{width:min(1180px,100%);height:min(720px,82vh);border-radius:18px;overflow:hidden;display:flex;position:relative;
 background:#0b0b0c;box-shadow:0 0 0 1px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.08),0 40px 90px rgba(0,0,0,.45)}
.side{width:var(--sw);flex:none;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(28,28,30,.96),rgba(18,18,20,.98));border-right:1px solid rgba(255,255,255,.06);transition:width .35s cubic-bezier(.4,0,.2,1)}
.shead{height:52px;display:flex;align-items:center;gap:8px;padding:0 10px 0 16px}
.lights{display:flex;gap:8px;flex:1}.lights i{width:12px;height:12px;border-radius:50%}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.gbtn{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ddd;font-size:18px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.12);cursor:pointer}
.search{margin:2px 10px 10px;height:28px;border-radius:9px;display:flex;align-items:center;gap:7px;padding:0 9px;font-size:12.5px;color:var(--dim);background:rgba(255,255,255,.06)}
.plan{flex:1;overflow:auto;padding:0 10px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:104px;gap:6px;align-content:start;scrollbar-width:none}
.compact{--sw:132px}.compact .plan{grid-template-columns:1fr;grid-auto-rows:92px}
.compact .search{display:none}
.room{position:relative;border-radius:14px;overflow:hidden;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;
 box-shadow:inset 0 0 0 1px rgba(var(--c),calc(.05 + var(--k)*.16));transition:box-shadow .25s}
.room::before{content:"";position:absolute;inset:0;background:radial-gradient(62% 78% at 50% 42%,rgba(var(--c),calc(var(--k)*.30)),rgba(var(--c),calc(var(--k)*.05)) 62%,transparent 82%);transition:opacity .4s}
.room.busy::before{animation:flick 3.4s ease-in-out infinite}
.room.ask::before{animation:breath2 2.2s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:1}40%{opacity:.8}55%{opacity:.95}}
@keyframes breath2{50%{opacity:.55}}
.room.sel{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.room:not(.compact *) {}
.plan .room.wide{grid-column:span 2}
.compact .plan .room.wide{grid-column:auto}
.room .n{position:relative;font-size:11px;color:var(--mut);z-index:2;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room.sel .n{color:var(--txt)}
.room .sph{width:38px;z-index:2}
.room .floor{position:absolute;left:50%;top:calc(50% + 6px);width:52%;height:10%;translate:-50% 0;border-radius:50%;filter:blur(5px);background:rgba(0,0,0,.9);z-index:1}
.room.out .sph,.room.out .floor{opacity:0}
.room.out .door{position:absolute;bottom:0;left:50%;translate:-50% 0;width:26%;height:4px;border-radius:3px 3px 0 0;background:rgba(var(--c),.85);box-shadow:0 0 12px rgba(var(--c),.9);z-index:2}
.room .bdg{position:absolute;top:7px;right:7px;z-index:3;min-width:17px;height:17px;border-radius:9px;padding:0 5px;font:600 10px var(--sf);display:flex;align-items:center;justify-content:center;background:#f5f5f7;color:#000}
.room .bdg.warn{background:none;color:rgb(255,176,72);font-size:13px}
.busy{--c:255,176,72;--k:1}.free{--c:48,209,88;--k:.5}.ask{--c:120,170,255;--k:.9}.off{--c:120,120,124;--k:0}
.cellar{grid-column:1/-1;height:40px;align-self:start;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:var(--dim);background:repeating-linear-gradient(135deg,#0b0b0c 0 6px,#0e0e0f 6px 12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.cellar i{width:9px;height:13px;border-radius:5px 5px 1px 1px;border:1.5px solid #3a3a3c}
.compact .cellar span{display:none}
.sfoot{height:52px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11.5px;color:var(--mut)}
.sfoot .pill{display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:980px;background:rgba(255,255,255,.07)}
.sfoot .pill i{width:6px;height:6px;border-radius:50%;background:#30d158}

/* sphere */
.sph{position:relative;border-radius:50%;aspect-ratio:1;flex:none;
 background:radial-gradient(circle at 36% 24%,rgba(255,255,255,.9) 0,rgba(255,255,255,.5) 2.5%,rgba(var(--c),.45) 5%,transparent 11%),radial-gradient(120% 60% at 50% 125%,rgba(var(--c),calc(var(--k)*.9)) 0,rgba(var(--c),calc(var(--k)*.35)) 38%,transparent 46%),radial-gradient(circle at 37% 30%,#3a3836 0%,#1f1d1c 50%,#0b0a0a 100%);
 box-shadow:inset 0 -2px 4px rgba(var(--c),calc(var(--k)*.35)),inset 0 -10px 18px rgba(0,0,0,.55)}
.sph::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 37% 30%,rgba(var(--t,0,0,0),.55),rgba(var(--t,0,0,0),.28) 50%,rgba(var(--t,0,0,0),.10) 100%);mix-blend-mode:color;pointer-events:none}
.sph .br{z-index:1;position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);width:54%;display:flex;gap:9%}
.sph .br svg{width:45.5%;height:auto;overflow:visible}.sph .br path{fill:#f5f5f7}
.off .sph{filter:brightness(.45)}.off .sph .br path{fill:#7c7c80}
.busy .sph{animation:bob 1.6s ease-in-out infinite}.free .sph{animation:breathe 5s ease-in-out infinite}
@keyframes bob{50%{translate:0 -1.5px}}@keyframes breathe{50%{translate:0 -2px}}

/* content */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% -10%,#18181a 0%,#0b0b0c 60%)}
.tbar{height:52px;flex:none}
.tgroup{position:absolute;top:11px;right:12px;z-index:5}
.tgroup{display:flex;gap:2px;padding:3px;border-radius:980px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.1)}
.tgroup span{width:32px;height:26px;border-radius:980px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#cfcfd4}
.tgroup span.on{background:rgba(255,255,255,.14);color:#fff}
.tgroup svg{width:16px;height:16px}
.hero{display:flex;flex-direction:column;align-items:center;margin-top:-34px}
.hero .sph{width:56px}
.hero .n{font-size:15px;font-weight:600;margin-top:8px}.hero .w{font-size:11.5px;color:var(--mut);margin-top:2px}
.thread{flex:1;overflow:hidden;width:100%;mask-image:linear-gradient(transparent,#000 10%)}
.col{width:min(560px,88%);margin:0 auto;padding:22px 0;display:flex;flex-direction:column;gap:10px}
.b{max-width:78%;padding:11px 16px;border-radius:21px;font-size:14px;line-height:1.5}
.you{align-self:flex-end;background:linear-gradient(160deg,#3c3c3f,#2b2b2e);border-bottom-right-radius:8px}
.it{align-self:flex-start;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);border-bottom-left-radius:8px}
.tool{align-self:flex-start;font-size:12px;color:var(--mut);padding-left:4px;margin-bottom:-4px}
.comp{width:min(560px,88%);margin:0 auto 20px;height:52px;border-radius:26px;display:flex;align-items:center;gap:10px;padding:0 8px 0 10px;flex:none;
 background:rgba(255,255,255,.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px rgba(255,255,255,.08),0 20px 40px rgba(0,0,0,.5)}
.comp .plus{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--mut);background:rgba(255,255,255,.06)}
.comp span.ph{flex:1;min-width:0;color:var(--dim);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp .model{font-size:12px;color:var(--mut);padding:5px 10px;border-radius:980px;background:rgba(255,255,255,.06);white-space:nowrap}
.comp .ring{width:20px;height:20px;border-radius:50%;background:conic-gradient(#f5f5f7 0 34%,rgba(255,255,255,.12) 0);-webkit-mask:radial-gradient(closest-side,transparent 68%,#000 70%)}
.comp .send{width:36px;height:36px;border-radius:50%;background:linear-gradient(160deg,#f5f5f7,#b8b8bc)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding-bottom:60px}
.empty .ico{width:120px;height:84px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.3fr 1fr;gap:4px;padding:4px;border-radius:14px;background:linear-gradient(160deg,#1c1c1e,#0e0e0f);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);margin-bottom:10px}
.empty .ico i{border-radius:8px;background:#0a0a0a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.empty .ico i:first-child{grid-column:span 2;background:radial-gradient(60% 80% at 50% 50%,rgba(255,176,72,.25),#0a0a0a 75%)}
.empty .ico i:nth-child(3){background:radial-gradient(60% 80% at 50% 50%,rgba(48,209,88,.18),#0a0a0a 75%)}
.empty b{font-size:15px;font-weight:600;color:#c8c8cd}.empty span{font-size:13px;color:var(--mut);max-width:34ch;line-height:1.45}

/* inspector */
.insp{width:var(--iw);flex:none;border-left:1px solid rgba(255,255,255,.06);background:rgba(16,16,18,.9);padding:52px 12px 12px;display:flex;flex-direction:column;gap:12px;transition:width .35s cubic-bezier(.4,0,.2,1),padding .35s,opacity .25s;overflow:hidden}
.noinsp .insp{width:0;padding-left:0;padding-right:0;opacity:0}
.slab{border-radius:22px;padding:15px;position:relative;background:linear-gradient(160deg,#2a2a2c 0%,#141415 45%,#1c1c1e 70%,#0c0c0d 100%);box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.14);min-width:262px}
.slab .k{font:10px ui-monospace,SF Mono,monospace;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.slab .k b{font:500 11px var(--sf);letter-spacing:0;text-transform:none;color:var(--mut)}
.mscr{margin-top:10px;aspect-ratio:16/10;max-width:100%;border-radius:13px;overflow:hidden;background:#1d1e22;position:relative}
.mscr .mb{height:9%;background:#2a2b30}
.mscr .tk{position:absolute;left:5%;right:5%;height:13%;border-radius:4px;background:#26272c}
.mscr .tk::after{content:"";position:absolute;left:var(--l);width:var(--w);top:20%;bottom:20%;border-radius:3px;background:var(--c);opacity:.75}
.mscr .cur{position:absolute;width:9px;height:9px;border-radius:50%;background:rgb(255,176,72);box-shadow:0 0 0 2px rgba(0,0,0,.5);animation:wander 5s ease-in-out infinite}
@keyframes wander{0%,100%{left:30%;top:40%}33%{left:62%;top:28%}66%{left:48%;top:70%}}
.prov{display:flex;align-items:center;gap:12px;margin-top:12px}
.prov .lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,#3a3a3c,#1c1c1e);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.prov .tx{flex:1}.prov .tx b{display:block;font-size:14px}.prov .tx span{font-size:11.5px;color:var(--mut)}
.prov .chev{color:var(--dim)}
.iempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;color:var(--mut);font-size:12.5px;min-width:262px;padding-bottom:60px}
.iempty b{color:#a8a8ad;font-size:13.5px}
.hint{font-size:12px;color:#2a2a30;text-align:center;max-width:70ch;line-height:1.5}

/* view switch: plan or rows */
.srow{display:flex;gap:6px;align-items:center;margin:2px 10px 10px}
.srow .search{margin:0;flex:1;min-width:0}
.seg{display:flex;padding:2px;border-radius:8px;background:rgba(255,255,255,.06);flex:none}
.seg span{width:26px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--mut);cursor:pointer}
.seg span.on{background:rgba(255,255,255,.14);color:#fff}
.seg svg{width:14px;height:14px}
.compact .srow{flex-direction:column;align-items:stretch}.compact .srow .search{display:none}.compact .seg{justify-content:center}
/* rows */
.rows{flex:1;overflow:auto;padding:0 8px;display:flex;flex-direction:column;gap:2px;scrollbar-width:none}
.row{position:relative;display:flex;align-items:center;gap:11px;height:52px;padding:0 10px 0 8px;border-radius:12px;cursor:pointer;overflow:hidden}
.row::before{content:"";position:absolute;left:-30px;top:50%;width:110px;height:110px;translate:0 -50%;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--c),calc(var(--k)*.26)),transparent 75%);pointer-events:none}
.row.busy::before{animation:flick 3.4s ease-in-out infinite}
.row:hover{background:rgba(255,255,255,.04)}
.row.sel{background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.row .sph{width:30px;position:relative;z-index:1}
.row .tx{flex:1;min-width:0;position:relative}
.row .tx b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{display:block;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .bdg{position:relative;min-width:18px;height:18px;border-radius:9px;padding:0 5px;font:600 10.5px var(--sf);display:flex;align-items:center;justify-content:center;background:#f5f5f7;color:#000}
.row .bdg.warn{background:none;color:rgb(255,176,72);font-size:13px}
.rows .cellarrow{display:flex;align-items:center;gap:9px;height:36px;padding:0 12px;margin-top:6px;font-size:12px;color:var(--dim);border-top:1px solid rgba(255,255,255,.05)}
.rows .cellarrow i{width:9px;height:13px;border-radius:5px 5px 1px 1px;border:1.5px solid #3a3a3c}
.compact .row{flex-direction:column;justify-content:center;height:72px;gap:5px;padding:0}
.compact .row .tx{flex:none;text-align:center;max-width:100%}.compact .row .tx span{display:none}.compact .row .tx b{font-size:11px;font-weight:500}
.compact .row .bdg{position:absolute;top:6px;right:10px}
.compact .row::before{left:50%;top:38%;translate:-50% -50%}
/* provider placements */
.provbtn{width:30px;height:30px;border-radius:50%;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.12);cursor:pointer;position:relative}
.provbtn .warnd{position:absolute;right:1px;top:1px;width:8px;height:8px;border-radius:50%;background:rgb(255,176,72);box-shadow:0 0 0 2px #1c1c1e}
.p-shead .provbtn{display:flex}
.p-shead .sfoot,.p-insp .sfoot,.p-settings .sfoot{display:none}
[hidden]{display:none!important}
.pop{position:absolute;top:48px;left:10px;width:250px;z-index:20;padding:8px;border-radius:16px;background:rgba(36,36,40,.94);backdrop-filter:blur(30px);box-shadow:0 0 0 1px rgba(255,255,255,.1),0 20px 50px rgba(0,0,0,.5);display:none}
.pop.on{display:block}
.pop .h{font-size:11px;color:var(--dim);padding:6px 10px;text-transform:uppercase;letter-spacing:.04em}
.pop .p{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:13px}
.pop .p:hover{background:rgba(255,255,255,.07)}
.pop .p i{width:7px;height:7px;border-radius:50%;background:#30d158;margin-left:auto}
.pop .p i.w{background:rgb(255,176,72)}
.pop .f{font-size:12.5px;padding:8px 10px;border-top:1px solid rgba(255,255,255,.08);margin-top:4px;color:#ddd}
.allprov{display:none;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);font-size:12.5px;color:var(--mut);justify-content:space-between}
.p-insp .allprov{display:flex}
.setnote{display:none;position:absolute;left:50%;bottom:10px;translate:-50% 0;font-size:11.5px;color:var(--mut);padding:6px 12px;border-radius:980px;background:rgba(255,255,255,.06);z-index:4;white-space:nowrap}
.p-settings .setnote{display:block}
.legendp{font-size:12px;color:#222;max-width:80ch;text-align:center;line-height:1.5;min-height:36px}
</style></head><body>
<div class="ctl" id="ctl">
 <button data-k="plan" class="on">Impostazioni: Stanze</button><button data-k="rows">Impostazioni: Righe</button>
 <button data-k="sel" class="on">Worker selezionato</button><button data-k="none">Nessun worker</button>
 <button data-k="wide" class="on">Barra larga</button><button data-k="compact">Barra compatta</button>
 <button data-k="insp" class="on">Inspector aperto</button><button data-k="noinsp">Inspector chiuso</button>
</div>

<div class="win" id="win">
 <aside class="side">
  <div class="shead"><div class="lights"><i></i><i></i><i></i></div><div class="provbtn" id="provbtn" title="Provider"><svg width="15" height="12" viewBox="0 0 16 12"><circle cx="3" cy="3" r="2" fill="none" stroke="#cfcfd4"/><circle cx="13" cy="3" r="2" fill="none" stroke="#cfcfd4"/><circle cx="8" cy="10" r="2" fill="none" stroke="#cfcfd4"/><path d="M5 3h6M4 4.5l3 4M12 4.5l-3 4" stroke="#cfcfd4"/></svg><i class="warnd"></i></div><div class="gbtn" title="Nuovo worker">+</div></div>
  <div class="pop" id="pop"><div class="h">Provider</div><div class="p">Anthropic<i></i></div><div class="p">OpenAI<i></i></div><div class="p">Ollama<i class="w"></i></div><div class="f">Gestisci i provider… ⌘,</div></div>
  <div class="srow"><div class="search">⌕ Cerca <span style="margin-left:auto;opacity:.6">⌘F</span></div></div>
  <div class="plan" id="plan"></div><div class="rows" id="rows" hidden></div>
  <div class="sfoot" title="Provider"><svg width="16" height="12" viewBox="0 0 16 12"><circle cx="3" cy="3" r="2" fill="none" stroke="#8e8e93"/><circle cx="13" cy="3" r="2" fill="none" stroke="#8e8e93"/><circle cx="8" cy="10" r="2" fill="none" stroke="#8e8e93"/><path d="M5 3h6M4 4.5l3 4M12 4.5l-3 4" stroke="#8e8e93"/></svg><span class="pill"><i></i>3</span></div>
 </aside>
 <main class="main" id="main">
  <div class="tbar"><div class="tgroup"><span id="tScreen" title="Schermo del worker"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 14h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span><span id="tInsp" class="on" title="Inspector"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 7v4.2M8 4.6v.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span></div></div>
  <div id="content"></div><div class="setnote">Provider solo nelle Impostazioni (⌘,), con un avviso qui solo se una connessione non va</div>
 </main>
 <aside class="insp" id="insp"></aside>
</div>

const ST={busy:"WORKING",free:"IDLE",ask:"ASKING",off:"OFFLINE"};
const face=(s,t)=>`<div class="sph" style="${t?`--t:${t}`:''}"><div class="br"><svg viewBox="0 0 240 170"><path d="${P[s][0]}"/></svg><svg viewBox="0 0 240 170"><path d="${P[s][1]}"/></svg></div></div>`;
const W=[{n:"Delivery",st:"busy",a:"sta esportando l'AAF",wide:1,t:"70,200,110"},{n:"Render",st:"busy",a:"render al 42%",b:"!",t:"80,150,235"},{n:"Mastering",st:"free",a:"libero",t:"150,110,235"},{n:"Ingest",st:"ask",a:"ti aspetta",b:"2",t:"175,105,225"},{n:"Prova",st:"free",a:"libero",t:"200,110,215"},{n:"PT Agent",st:"off",a:"spento",t:"190,120,230"}];
let sel=0,showSel=true;
const $=id=>document.getElementById(id);
function plan(){$('plan').innerHTML=W.map((w,i)=>{const out=showSel&&i===sel;
 return `<div class="room ${w.st}${w.wide?' wide':''}${out?' sel out':''}" data-i="${i}">${w.b&&!out?`<span class="bdg ${w.b==='!'?'warn':''}">${w.b}</span>`:''}${face(ST[w.st],w.t)}<i class="floor"></i>${out?'<i class="door"></i>':''}<div class="n">${out?'è da te':w.n}</div></div>`}).join('')+'<div class="cellar"><i></i><span>Archivio · 3</span></div>';
 document.querySelectorAll('.room').forEach(r=>r.onclick=()=>{sel=+r.dataset.i;showSel=true;setBtn('sel');render()})}
function content(){
 if(!showSel){$('content').innerHTML=`<div class="empty"><div class="ico"><i></i><i></i><i></i></div><b>Nessun worker scelto</b><span>Scegli una stanza per parlare con il suo worker.</span></div>`;$('content').style.cssText='flex:1;display:flex';return}
 const w=W[sel];$('content').style.cssText='flex:1;display:flex;flex-direction:column;min-height:0';
 $('content').innerHTML=`<div class="hero ${w.st}">${face(ST[w.st],w.t)}<div class="n">${w.n}</div><div class="w">${w.a}</div></div>
 <div class="thread"><div class="col"><div class="b you">Esporta la sessione Pro Tools aperta come AAF nella cartella Delivery.</div><div class="tool">Ha aperto Pro Tools e letto la sessione</div><div class="b it">Controllo la sessione, esporto l'AAF e ti confermo la consegna.</div><div class="b it">Il dialogo ha un preset che non conosco. Lo tengo o metto stereo interleaved?</div><div class="b you">Stereo interleaved.</div></div></div>
 <div class="comp"><div class="plus" title="Allegati, web, finestra Chrome">+</div><span class="ph">Scrivi a ${w.n}</span><div class="model">Opus 5.5 · alto</div><div class="ring" title="Contesto 34%"></div><div class="send"></div></div>`}
function insp(){
 if(!showSel){$('insp').innerHTML=`<div class="iempty"><b>Nessun worker</b>I dettagli compaiono quando scegli una stanza.</div>`;return}
 const w=W[sel];
 $('insp').innerHTML=(w.st==='busy'?`<div class="slab"><div class="k">Schermo <b>Pro Tools</b></div><div class="mscr"><div class="mb"></div><div class="tk" style="top:18%;--l:4%;--w:60%;--c:#5b8def"></div><div class="tk" style="top:38%;--l:20%;--w:50%;--c:#e0a346"></div><div class="tk" style="top:58%;--l:8%;--w:75%;--c:#58c48d"></div><div class="tk" style="top:78%;--l:30%;--w:40%;--c:#c46fd6"></div><i class="cur"></i></div></div>`:'')+

let mode='plan';
function rows(){$('rows').innerHTML=W.map((w,i)=>{const out=showSel&&i===sel;
 return `<div class="row ${w.st}${out?' sel':''}" data-i="${i}">${face(ST[w.st],w.t)}<div class="tx"><b>${w.n}</b><span>${w.a}</span></div>${w.b?`<span class="bdg ${w.b==='!'?'warn':''}">${w.b}</span>`:''}</div>`}).join('')+'<div class="cellarrow"><i></i>Archivio · 3</div>';
 document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{sel=+r.dataset.i;showSel=true;setBtn('sel');render()})}
function render(){$('plan').hidden=mode!=='plan';$('rows').hidden=mode!=='rows';if(mode==='plan')plan();else rows();content();insp()}
function setMode(m){mode=m;['plan','rows'].forEach(k=>document.querySelector(`[data-k="${k}"]`).classList.toggle('on',k===m));render()}

const LP={foot:"Oggi: icona e badge in fondo alla barra laterale, lontani dal resto e sempre visibili anche quando va tutto bene.",

function setP(p){const w=$('win');['foot','shead','insp','settings'].forEach(k=>w.classList.toggle('p-'+k,k===p));document.querySelectorAll('#pctl button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));$('pop').classList.remove('on')}
document.querySelectorAll('#pctl button').forEach(b=>b.onclick=()=>setP(b.dataset.p));
$('provbtn').onclick=e=>{e.stopPropagation();$('pop').classList.toggle('on')};addEventListener('click',()=>$('pop').classList.remove('on'));
function setBtn(k){const pairs={sel:'none',none:'sel',wide:'compact',compact:'wide',insp:'noinsp',noinsp:'insp',plan:'rows',rows:'plan'};document.querySelector(`[data-k="${k}"]`).classList.add('on');document.querySelector(`[data-k="${pairs[k]}"]`).classList.remove('on')}
document.querySelectorAll('#ctl button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;setBtn(k);
 if(k==='plan'||k==='rows'){setMode(k);return}
 if(k==='sel'){showSel=true;render()}if(k==='none'){showSel=false;render()}
 if(k==='wide')$('win').classList.remove('compact');if(k==='compact')$('win').classList.add('compact');
 if(k==='insp'){$('win').classList.remove('noinsp');$('tInsp').classList.add('on')}if(k==='noinsp'){$('win').classList.add('noinsp');$('tInsp').classList.remove('on')}});
$('tInsp').onclick=()=>{const c=$('win').classList.toggle('noinsp');$('tInsp').classList.toggle('on',!c);setBtn(c?'noinsp':'insp')};
setP('insp');render();
